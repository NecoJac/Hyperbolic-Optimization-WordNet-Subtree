data:
  mode: real_wordnet
  embeddings_by_dim:
    "2": data/embeddings/wordnet_embeddings_d2.csv
  edges_path: data/processed/wordnet_edges.csv
  test_size: 0.2
  split_protocol: subtree_balanced

experiment:
  subtrees: [MAMMAL.N.01]
  dims: [2]
  seeds: [0]
  epochs: 2
  batch_size: 1024
  lr: 0.01
  weight_decay: 0.0
  device: cpu

settings:
  - model: euclidean_lr
    optimizer: adam
  - model: logmap_lr
    optimizer: adam
  - model: hyperbolic_mlr
    optimizer: projected_adam
  - model: hyperbolic_mlr
    optimizer: radam

outputs:
  root: results_smoke
  figures_subtrees: [MAMMAL.N.01]
